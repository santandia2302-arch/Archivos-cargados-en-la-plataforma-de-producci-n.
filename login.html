<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Eat It</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" rel="stylesheet" href="css/materialize.min.css">
  <link rel="icon" href="imagenes/sususu.png" type ="image/x-icon">
</head>
<body>
  <nav class="orange accent-4">
    <div class="nav-wrapper container">
      <a href="index.html" class="brand-logo">
        <img src="imagenes/sususu.png" alt="logo" style="width: 65px;"/>
      </a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="sobre.html">¿Qué es EATIT?</a></li>
        <li><a href="trabajo.html">¡Trabaja con nosotros!</a></li>
      </ul>
    </div>
  </nav>
  <main>
    <div class="container" style="max-width: 400px; margin-top: 40px;">
      <h4 class="orange-text center-align">Iniciar sesión</h4>
      <form>
        <div class="input-field">
          <input id="email" type="email" class="validate" required>
          <label for="email">Correo electrónico</label>
        </div>
        <div class="input-field">
          <input id="password" type="password" class="validate" required>
          <label for="password">Contraseña</label>
        </div>
        <button class="btn orange accent-4 waves-effect waves-light" type="submit" style="width:100%;">Entrar</button>
      </form>
      <div class="center-align" style="margin-top: 20px;">
        <a href="registro.html" class="btn-flat orange-text">Crear cuenta</a>
        <a href="#" class="btn-flat orange-text">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </main>
  <footer class="page-footer orange accent-4">
    <div class="footer-copyright">
      <div class="container">
        © 2026 Eat It
        <p class="grey-text text-lighten-4">Desarrollado por: Santiago Castro Fajardo.</p>
      </div>
    </div>
  </footer>
  <script type="text/javascript" src="js/materialize.min.js"></script>
</body>
</html>
